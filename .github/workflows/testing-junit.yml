name: Pruebas de Java con JUnit

on:
  push:
    paths:
      - 'projects/testing-junit/**'
      - '.github/workflows/testing-junit.yml'
  pull_request:
    paths:
      - 'projects/testing-junit/**'
      - '.github/workflows/testing-junit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/testing-junit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: projects/testing-junit/pom.xml
      - run: mvn --batch-mode --no-transfer-progress test
